[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii2svg"
version = "1.4.0"
description = "Render ASCII/Unicode box diagrams as SVG, 1:1 - colour, dark mode and animation, with a built-in self-check"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Satyadip Paul" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["ascii", "diagram", "svg", "ascii-art", "box-drawing", "flowchart",
            "architecture-diagram", "animation", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
width = ["wcwidth>=0.2.6"]
png = ["cairosvg>=2.5"]

[project.urls]
Homepage = "https://satyadippaul.github.io/ascii2svg/"
Source = "https://github.com/SatyadipPaul/ascii2svg"
Issues = "https://github.com/SatyadipPaul/ascii2svg/issues"
Releases = "https://github.com/SatyadipPaul/ascii2svg/releases"

[project.scripts]
ascii2svg = "ascii2svg:main"

[tool.setuptools]
py-modules = ["ascii2svg"]
package-dir = {"" = "scripts"}
