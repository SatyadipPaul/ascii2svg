name: publish

# Publishing a GitHub release (tag vX.Y.Z) builds the package, uploads it to PyPI with
# Trusted Publishing (no tokens stored anywhere) and attaches ascii2svg.skill to the release.
# The npm package (@satyadip28/asciitosvg) goes out the same way, once the repository variable
# NPM_PUBLISH is "true" (after the first publish by hand and linking this workflow on npmjs.com).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release tag matches the package version
        run: |
          v="v$(python scripts/ascii2svg.py --version | cut -d' ' -f2)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME != package $v"; exit 1; fi
      - run: python tests/test_ascii2svg.py
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ascii2svg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  skill:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/package_skill.py
      - name: Attach the Claude skill to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ascii2svg.skill --clobber

  npm:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                                   # npm trusted publishing (OIDC), with provenance
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest                  # trusted publishing needs npm 11.5.1 or later
      - name: Release tag matches the npm package version
        run: |
          v="v$(node -p 'require("./package.json").version')"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME != npm package $v"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm publish
