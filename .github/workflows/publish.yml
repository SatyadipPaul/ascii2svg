name: publish

# Publishing a GitHub release (tag vX.Y.Z) builds the package, uploads it to PyPI with
# Trusted Publishing (no tokens stored anywhere) and attaches ascii2svg.skill to the release.
# The npm package (@satyadip28/asciitosvg) goes out the same way, once the repository variable
# NPM_PUBLISH is "true" (after the first publish by hand and linking this workflow on npmjs.com).
#
# Or run it by hand on main (Actions > publish > Run workflow): it first creates the tag
# v<package version> and the release, with .github/release-notes.md as the notes, then publishes
# the same way. It stops if that tag already exists.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag to publish
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(python3 scripts/ascii2svg.py --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the tag and the release (manual runs, from main only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then echo "run this from main, not $GITHUB_REF_NAME"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; bump the version first"; exit 1
          fi
          title="$(head -n 1 .github/release-notes.md | sed 's/^# *//')"
          tail -n +3 .github/release-notes.md > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release tag matches the package version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          v="v$(python scripts/ascii2svg.py --version | cut -d' ' -f2)"
          if [ "$v" != "$TAG" ]; then echo "tag $TAG != package $v"; exit 1; fi
      - run: python tests/test_ascii2svg.py
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ascii2svg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  skill:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/package_skill.py
      - name: Attach the Claude skill to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/ascii2svg.skill --clobber

  npm:
    needs: [release, build]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                                   # npm trusted publishing (OIDC), with provenance
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest                  # trusted publishing needs npm 11.5.1 or later
      - name: Release tag matches the npm package version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          v="v$(node -p 'require("./package.json").version')"
          if [ "$v" != "$TAG" ]; then echo "tag $TAG != npm package $v"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm publish
